server {
    listen 80;
    listen 443 ssl;
    server_name api.junxiangshiping.cn;

    access_log /www/sites/api.junxiangshiping.cn/log/access.log main;
    error_log /www/sites/api.junxiangshiping.cn/log/error.log;

    location ~ ^/(?:\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md)(?:/|$) {
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    http2 on;
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /www/sites/api.junxiangshiping.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/api.junxiangshiping.cn/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /www/sites/api.junxiangshiping.cn/proxy/*.conf;
}
