server {
    listen 80;
    server_name api.junxiangshiping.cn admin.junxiangshiping.cn;

    access_log /www/sites/shop-production-acme/log/access.log main;
    error_log /www/sites/shop-production-acme/log/error.log;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 503;
    }
}
