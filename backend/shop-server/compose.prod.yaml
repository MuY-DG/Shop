name: shop

services:
  mysql:
    # 固定 MySQL 8.4 LTS 补丁版本，避免自动升级造成不可预期变化。
    image: mysql:8.4.10
    # 数据库异常退出或服务器重启后自动恢复。
    restart: unless-stopped
    # Compose 通过 --env-file 读取唯一 runtime manifest，本服务只注入 MySQL 所需白名单。
    environment:
      MYSQL_DATABASE: hotpot_shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: ${SHOP_DB_PASSWORD:?SHOP_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${SHOP_DB_ROOT_PASSWORD:?SHOP_DB_ROOT_PASSWORD is required}
      TZ: UTC
    # 使用 utf8mb4，并限制连接数与 InnoDB 缓冲池，避免数据库挤占应用资源。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=512M
      - --max-connections=100
      - --skip-name-resolve
    # 数据库文件保存在 Docker 命名卷中，重建容器不会丢失。
    volumes:
      - mysql-data:/var/lib/mysql
    # MySQL 完成初始化并能够响应后，应用容器才允许启动。
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    ports:
      # 仅服务器回环地址可访问；配合 SSH 隧道供本机数据库工具连接，公网无法直连。
      - "127.0.0.1:3306:3306"
    # 应用仍通过隔离的 data 网络访问；ops 仅作为回环端口发布所需的默认网关。
    networks:
      data:
      ops:
        gw_priority: 1
    # 为应用、1Panel 和操作系统预留足够内存。
    mem_limit: 1g
    # 禁止容器进程获得额外 Linux 权限。
    security_opt:
      - no-new-privileges:true
    # 限制单个容器日志大小，避免持续占用系统盘。
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  redis:
    # 固定 Redis 7.4 补丁版本并使用体积较小的 Alpine 官方镜像。
    image: redis:7.4.9-alpine
    # Redis 异常退出或服务器重启后自动恢复。
    restart: unless-stopped
    # Redis 只读取自己的密码，不接触 MySQL 或应用加密密钥。
    environment:
      REDIS_PASSWORD: ${SHOP_REDIS_PASSWORD:?SHOP_REDIS_PASSWORD is required}
    # 开启 AOF everysec，并要求密码后才接受命令。
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    # AOF 和快照保存在 Docker 命名卷中。
    volumes:
      - redis-data:/data
    # 只有认证成功并收到 PONG 才判定 Redis 健康。
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      # 仅服务器回环地址可访问；配合 SSH 隧道供本机 Redis 工具连接，公网无法直连。
      - "127.0.0.1:6379:6379"
    # 应用仍通过隔离的 data 网络访问；ops 仅作为回环端口发布所需的默认网关。
    networks:
      data:
      ops:
        gw_priority: 1
    # Redis 主要保存会话和安全计数，限制内存防止挤占 JVM/MySQL。
    mem_limit: 256m
    # 禁止容器进程获得额外 Linux 权限。
    security_opt:
      - no-new-privileges:true
    # 限制单个容器日志大小，避免填满系统盘。
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  shop-server:
    # 部署脚本在服务器构建并更新这个本地镜像标签。
    image: shop-server:local
    # 镜像只在目标服务器构建，不访问公开镜像仓库。
    pull_policy: never
    # MySQL 和 Redis 均通过健康检查后才启动应用。
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    working_dir: /opt/shop/shop-server

    environment:
      # txcloud 和 shop 共用相同的服务器 Profile。
      SPRING_PROFILES_ACTIVE: server
      # 应用内部与数据库统一使用 UTC；展示时由客户端转换到设备时区。
      TZ: UTC
      # 应用只获取自己的业务数据库密码、Redis 密码和加密边界。
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:?SHOP_DB_PASSWORD is required}
      SHOP_REDIS_PASSWORD: ${SHOP_REDIS_PASSWORD:?SHOP_REDIS_PASSWORD is required}
      SHOP_SECRET_ENCRYPTION_ACTIVE_KEY_ID: ${SHOP_SECRET_ENCRYPTION_ACTIVE_KEY_ID:?SHOP_SECRET_ENCRYPTION_ACTIVE_KEY_ID is required}
      SHOP_SECRET_ENCRYPTION_KEY_RING: ${SHOP_SECRET_ENCRYPTION_KEY_RING:?SHOP_SECRET_ENCRYPTION_KEY_RING is required}

    # 应用运行日志同时保留标准输出和每日 gzip 文件；重建容器不会删除归档。
    volumes:
      - shop-server-logs:/var/log/shop-server

    ports:
      # 只有宿主机 OpenResty/运维检查可以访问，公网不能直接访问 8080。
      - "127.0.0.1:8080:8080"

    # 应用可访问内部数据服务，也可通过普通网络访问微信与 COS。
    networks:
      data:
      edge:
        gw_priority: 1

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

    # 根文件系统只读，仅 /tmp 和显式挂载目录允许写入。
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    # JVM 最大使用约 75%，容器总内存限制为 1.1 GB。
    mem_limit: 1100m
    # 标准输出使用高效轮转驱动；详细运行日志另按天压缩到持久化卷。
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
        compress: "true"

# data 隔离业务数据流量；ops 为 MySQL/Redis 的宿主机回环端口提供默认网关。
networks:
  data:
    internal: true
    ipam:
      config:
        - subnet: 172.22.0.0/24
          gateway: 172.22.0.1
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
          gateway: 172.23.0.1
  ops:
    driver: bridge
    driver_opts:
      # 即使将来端口短语法漏写 Host IP，也默认只绑定服务器回环地址。
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
    ipam:
      config:
        - subnet: 172.24.0.0/24
          gateway: 172.24.0.1

# 命名卷由 Docker 管理，日常部署不会主动删除。
volumes:
  mysql-data:
  redis-data:
  shop-server-logs:
