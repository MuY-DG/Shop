name: shop

services:
  mysql:
    # 固定 MySQL 8.4 LTS 补丁版本，避免自动升级造成不可预期变化。
    image: mysql:8.4.10
    # 数据库异常退出或服务器重启后自动恢复。
    restart: unless-stopped
    # 只向 MySQL 容器注入基础设施变量，不暴露微信支付等应用密钥。
    env_file:
      - ./.env.infrastructure.local
    # 使用 utf8mb4，并按当前 4 GB 服务器限制连接数与 InnoDB 缓冲池。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=512M
      - --max-connections=100
      - --skip-name-resolve
    # 数据库文件保存在 Docker 命名卷中，重建容器不会丢失。
    volumes:
      - mysql-data:/var/lib/mysql
    # MySQL 完成初始化并能够响应后，应用容器才允许启动。
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    ports:
      # 仅服务器回环地址可访问；配合 SSH 隧道供本机数据库工具连接，公网无法直连。
      - "127.0.0.1:3306:3306"
    # 应用仍通过 Compose 内部网络中的 mysql:3306 访问数据库。
    networks:
      - data
    # 为应用、1Panel 和操作系统预留足够内存。
    mem_limit: 1g
    # 禁止容器进程获得额外 Linux 权限。
    security_opt:
      - no-new-privileges:true
    # 限制单个容器日志大小，避免填满 40 GB 系统盘。
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  redis:
    # 固定 Redis 7.4 补丁版本并使用体积较小的 Alpine 官方镜像。
    image: redis:7.4.9-alpine
    # Redis 异常退出或服务器重启后自动恢复。
    restart: unless-stopped
    # Redis 只读取自己的密码，不接触应用或数据库密钥。
    env_file:
      - ./.env.infrastructure.local
    # 开启 AOF everysec，并要求密码后才接受命令。
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    # AOF 和快照保存在 Docker 命名卷中。
    volumes:
      - redis-data:/data
    # 只有认证成功并收到 PONG 才判定 Redis 健康。
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      # 仅服务器回环地址可访问；配合 SSH 隧道供本机 Redis 工具连接，公网无法直连。
      - "127.0.0.1:6379:6379"
    # 应用仍通过 Compose 内部网络中的 redis:6379 访问 Redis。
    networks:
      - data
    # Redis 主要保存会话和安全计数，限制内存防止挤占 JVM/MySQL。
    mem_limit: 256m
    # 禁止容器进程获得额外 Linux 权限。
    security_opt:
      - no-new-privileges:true
    # 限制单个容器日志大小，避免填满系统盘。
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  shop-server:
    # 一键脚本把每个版本保留为独立标签，再将已验证版本指向 shop-server:local。
    image: ${SHOP_IMAGE:-shop-server:local}
    # SSH 直传模式不访问公开镜像仓库；切换私有仓库时可覆盖为 always。
    pull_policy: ${SHOP_IMAGE_PULL_POLICY:-never}
    # MySQL 和 Redis 均通过健康检查后才启动应用。
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    working_dir: /opt/shop/shop-server

    environment:
      # 容器始终启用生产 Profile。
      SPRING_PROFILES_ACTIVE: prod
      # 容器内部必须监听所有容器网卡，端口仍只发布到宿主机回环地址。
      SERVER_ADDRESS: 0.0.0.0

    ports:
      # 只有宿主机 OpenResty/运维检查可以访问，公网不能直接访问 8080。
      - "127.0.0.1:${SHOP_HOST_PORT:-8080}:8080"

    # 应用可访问内部数据服务，也可通过普通网络访问微信与 COS。
    networks:
      - data
      - edge

    volumes:
      # Spring Boot 强制读取生产变量；文件只读挂载且绝不写进镜像。
      - type: bind
        source: ./.env.prod.local
        target: /opt/shop/shop-server/.env.prod.local
        read_only: true
      # 微信支付私钥和公钥只读挂载，路径与 .env.prod.local 保持一致。
      - type: bind
        source: ./secrets
        target: /opt/shop/shop-server/secrets
        read_only: true
      # LOCAL 存储回退和私密上传需要持久化；使用 COS 时仍保留应急目录。
      - type: bind
        source: ./var
        target: /opt/shop/shop-server/var

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

    # 根文件系统只读，仅 /tmp 和显式挂载目录允许写入。
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    # JVM 最大使用约 75%，容器总内存限制为 1.1 GB。
    mem_limit: 1100m
    # 限制应用日志大小；业务日志应输出到标准输出并由 1Panel 查看。
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

# MySQL 与 Redis 只允许 Compose 内部服务访问。
networks:
  data:
    internal: true
  edge:

# 命名卷由 Docker 管理，并可由 1Panel 进行查看和备份。
volumes:
  mysql-data:
  redis-data:
