spring:
  application:
    name: shop-server
  config:
    import: optional:file:.env.local[.properties]
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${SHOP_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${SHOP_MULTIPART_MAX_REQUEST_SIZE:51MB}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

shop:
  api:
    success-code: 200
    success-message: success
  auth:
    token-store: redis
    admin-access-ttl: 2h
    admin-refresh-ttl: 7d
    app-access-ttl: 7d
    app-refresh-ttl: 30d
  storage:
    provider: ${SHOP_STORAGE_PROVIDER:LOCAL}
    public-base-url: ${SHOP_STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
    local:
      root: ${SHOP_STORAGE_LOCAL_ROOT:var/uploads}
    tencent-cos:
      region: ${SHOP_STORAGE_TENCENT_COS_REGION:}
      bucket: ${SHOP_STORAGE_TENCENT_COS_BUCKET:}
      secret-id: ${SHOP_STORAGE_TENCENT_COS_SECRET_ID:}
      secret-key: ${SHOP_STORAGE_TENCENT_COS_SECRET_KEY:}
      public-base-url: ${SHOP_STORAGE_TENCENT_COS_PUBLIC_BASE_URL:}
    limits:
      image-max-size: ${SHOP_STORAGE_IMAGE_MAX_SIZE:5MB}
      video-max-size: ${SHOP_STORAGE_VIDEO_MAX_SIZE:50MB}
      private-file-max-size: ${SHOP_STORAGE_PRIVATE_FILE_MAX_SIZE:1MB}
  wechat:
    mini-program:
      app-id: ${WECHAT_MINI_PROGRAM_APP_ID:}
      app-secret: ${WECHAT_MINI_PROGRAM_APP_SECRET:}
      mock-enabled: false
    shipping:
      upload-enabled: ${SHOP_WECHAT_SHIPPING_UPLOAD_ENABLED:false}
  pay:
    enabled: ${WECHAT_PAY_ENABLED:false}
    mock-enabled: ${WECHAT_PAY_MOCK_ENABLED:false}
    config-source: ${WECHAT_PAY_CONFIG_SOURCE:AUTO}
    app-id: ${WECHAT_PAY_APP_ID:}
    mch-id: ${WECHAT_PAY_MCH_ID:}
    merchant-serial-no: ${WECHAT_PAY_MERCHANT_SERIAL_NO:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}
    refund-notify-url: ${WECHAT_PAY_REFUND_NOTIFY_URL:}
    verify-mode: ${WECHAT_PAY_VERIFY_MODE:PUBLIC_KEY}
    public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}
    public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}
    expire-minutes: ${SHOP_PAY_EXPIRE_MINUTES:15}
    secret-key: ${SHOP_PAYMENT_SECRET_KEY:}
