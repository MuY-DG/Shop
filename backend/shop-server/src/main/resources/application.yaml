spring:
  application:
    name: shop-server
  config:
    import: optional:file:.env.local[.properties]
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

shop:
  api:
    success-code: 200
    success-message: success
  auth:
    token-store: redis
    admin-access-ttl: 2h
    admin-refresh-ttl: 7d
    app-access-ttl: 7d
    app-refresh-ttl: 30d
  storage:
    provider: local
    public-base-url: ${SHOP_STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
    local:
      root: ${SHOP_STORAGE_LOCAL_ROOT:var/uploads}
    limits:
      image-max-size: ${SHOP_STORAGE_IMAGE_MAX_SIZE:5MB}
      private-file-max-size: ${SHOP_STORAGE_PRIVATE_FILE_MAX_SIZE:1MB}
  wechat:
    mini-program:
      app-id: ${WECHAT_MINI_PROGRAM_APP_ID:}
      app-secret: ${WECHAT_MINI_PROGRAM_APP_SECRET:}
      mock-enabled: false
