spring:
  application:
    name: shop-server
  datasource:
    hikari:
      connection-init-sql: SET time_zone = '+00:00' # 所有数据库连接统一使用 UTC，保证 TIMESTAMP 读写与 JVM、JSON 契约一致。
  jackson:
    default-property-inclusion: non_null # 返回 JSON 时省略值为 null 的字段。
  flyway:
    enabled: true # 应用启动时自动校验并执行尚未运行的迁移脚本。
    locations: classpath:db/migration # 从 jar 内的 db/migration 目录读取迁移脚本。
  data:
    redis:
      host: 127.0.0.1 # local 默认连接本机；server Profile 固定覆盖为 Compose 服务名 redis。
      port: 6379
      database: 0
      username: '' # 当前仅使用 requirepass，不启用 Redis ACL 用户名。
      password: ${SHOP_REDIS_PASSWORD} # 三套环境的 Redis 密码均只从各自 ignored manifest 读取。
      repositories: # 控制是否启用 Redis Repository 自动实现。
        enabled: false # 项目直接使用 RedisTemplate，因此关闭未使用的 Repository 扫描。
  servlet: # Servlet Web 容器的相关配置入口。
    multipart: # 配置 multipart/form-data 文件上传限制。
      max-file-size: 50MB # 限制单个上传文件大小。
      max-request-size: 51MB # 限制整个上传请求大小。

server:
  port: 8080
  forward-headers-strategy: none # 禁止容器自动改写代理头，由项目自己的可信代理逻辑统一处理。

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]" # 将请求 ID 写入控制台日志，便于后台摘要关联 1Panel 中的完整日志。

management: # Spring Boot Actuator 运维端点配置入口。
  endpoints: # 配置所有 Actuator 端点的暴露方式。
    web: # 配置通过 HTTP 暴露的 Actuator 端点。
      exposure: # 定义允许通过 Web 访问的端点范围。
        include: health,info # 仅暴露健康检查和应用信息端点。
  endpoint: # 配置单个 Actuator 端点的行为。
    health: # 配置 health 健康检查端点。
      probes: # 配置存活和就绪探针支持。
        enabled: true # 启用 liveness/readiness 健康探针。

springdoc: # Springdoc OpenAPI 文档功能配置入口。
  api-docs: # OpenAPI JSON 描述端点配置。
    enabled: false # 公共配置关闭接口描述端点，开发 Profile 单独开启。
  swagger-ui: # Swagger UI 浏览页面配置。
    enabled: false # 公共配置关闭接口浏览页面，开发 Profile 单独开启。

shop: # 商城项目自定义业务配置的统一入口。
  compliance: # 商家资质、法律文档与用户同意留痕。
    privacy-consent-required: false # 登录使用微信小程序平台隐私保护指引，不依赖后台环境变量。
  secret-encryption: # 后台持久化敏感配置共用的信封加密与轮换配置。
    active-key-id: ${SHOP_SECRET_ENCRYPTION_ACTIVE_KEY_ID} # 指定当前用于加密新数据的主密钥 ID。
    key-ring: ${SHOP_SECRET_ENCRYPTION_KEY_RING} # 配置可读取当前与历史 v2 密文的 AES-256 主密钥集合。
    rotation-enabled: false # 新环境没有待迁移密文，默认关闭自动轮换。
    rotation-delay: 1m # 密钥轮换任务每批之间等待 1 分钟。
    rotation-batch-size: 50 # 每批最多处理 50 条记录。
  content: # 首页和联系信息等内容模块的缓存配置。
    cache-enabled: true # 启用内容缓存。
    home-cache-ttl: 6h # 首页内容缓存有效期为 6 小时。
    contact-cache-ttl: 24h # 联系信息缓存有效期为 24 小时。
  auth: # 管理后台和小程序的认证会话配置。
    token-store: redis # 使用 Redis 保存访问令牌和刷新令牌。
    admin-access-ttl: 2h # 管理后台访问令牌有效期为 2 小时。
    admin-refresh-ttl: 7d # 管理后台刷新令牌有效期为 7 天。
    app-access-ttl: 7d # 小程序访问令牌有效期为 7 天。
    app-refresh-ttl: 30d # 小程序刷新令牌有效期为 30 天。
    admin-session-reconciliation: # 定期重试后台账号登录设备上限，修复 Redis 短暂故障造成的延迟裁剪。
      enabled: true # 启用幂等对账。
      initial-delay-ms: 30000 # 启动 30 秒后首次执行。
      fixed-delay-ms: 60000 # 每轮结束 60 秒后再次执行。
    admin-login-protection: # 管理员登录失败限制与锁定配置。
      enabled: true # 启用管理员登录保护。
      store: redis # 使用 Redis 保存登录失败计数。
      failure-window: 15m # 在 15 分钟统计窗口内累计失败次数。
      pair-failure-limit: 5 # 单个账号与 IP 组合最多允许失败 5 次。
      account-failure-limit: 12 # 单个账号在窗口内最多允许失败 12 次。
      ip-failure-limit: 30 # 单个来源 IP 在窗口内最多允许失败 30 次。
      lock-duration: 15m # 达到限制后锁定登录 15 分钟。
      memory-max-entries: 100000 # 使用内存存储时最多保留 100000 个计数项。
  security: # 商城应用层安全配置入口。
    client-ip: # 可信代理链和真实客户端 IP 解析配置。
      trusted-proxy-cidrs: 127.0.0.0/8,::1/128 # local 只信任本机代理；server Profile 增加固定 Docker edge 网关。
      max-forwarded-hops: 20 # local 最多解析 20 层；server Profile 固定收紧为 1 跳。
      max-forwarded-header-length: 2048 # 限制转发头最大长度为 2048 字符。
  analytics: # 访问统计和限流配置。
    rate-limit: # 访问统计事件写入的限流配置。
      enabled: true # 启用统计事件限流。
      window: 1m # 使用 1 分钟作为限流统计窗口。
      ip-event-limit: 5000 # 每个 IP 每个窗口最多记录 5000 个事件。
      visitor-event-limit: 1000 # 每个访客每个窗口最多记录 1000 个事件。
  storage: # 图片、视频和私有文件的素材存储配置。
    direct-upload: # 客户端直传 COS 的短期会话与限流策略。
      max-active-sessions-per-principal: 10 # 每个登录主体最多同时保留 10 个待完成直传，避免临时对象滥用。
      max-sessions-per-hour-app: 60 # 每位小程序用户每小时最多签发 60 次直传。
      max-sessions-per-hour-admin: 600 # 每位管理员每小时最多签发 600 次直传。
    customer-service-thumbnail: # 旧 Multipart 客服图片使用本地异步缩略图；直传路径由数据万象同步生成。
      max-dimension: 720 # 将最长边缩放至 720 像素且不放大小图。
      webp-enabled: true # WebP 不可用时自动降级为本地 JPEG，不阻塞消息。
      batch-size: 20 # 恢复任务每轮最多处理 20 张。
      processing-timeout: 5m # 超时任务可被下一轮重新认领。
      fixed-delay: 30s # 每 30 秒恢复遗漏或失败的任务。
      initial-delay: 10s # 应用启动 10 秒后开始首次扫描。
    limits: # 不同素材类型的安全与资源限制。
      image-max-size: 5MB # 单张图片最大允许 5MB。
      image-max-width: 8192 # 图片最大宽度限制为 8192 像素。
      image-max-height: 8192 # 图片最大高度限制为 8192 像素。
      image-max-pixels: 25000000 # 图片总像素数最大限制为 2500 万。
      video-max-size: 50MB # 单个视频最大允许 50MB。
  wechat: # 微信平台相关功能配置入口。
    mini-program: # 微信小程序登录和接口调用配置。
      mock-enabled: false # 基础配置强制关闭小程序模拟模式。
    service-card-2001: # 新版“购物（实体物流）服务动态”，不使用传统订阅消息接口。
      delay: 15s
      batch-size: 50
      claim-timeout: 2m
      max-attempts: 8
      retry-backoff: 1m
      max-retry-backoff: 30m
      unknown-recheck-interval: 1m
      max-unknown-recheck-interval: 6h
      not-applied-confirmations: 2
      connect-timeout: 3s
      read-timeout: 15s
      max-response-size: 1MB
      max-payload-size: 64KB
      callback:
        max-timestamp-skew: 5m
    express: # 微信物流助手与电子面单接口的独立 HTTP 安全边界。
      http:
        connect-timeout: 3s # 建立微信 API 连接最多等待 3 秒。
        read-timeout: 15s # 单次微信物流请求最多等待 15 秒。
        max-response-size: 5MB # 解码前最多读取 5MB 响应体。
      tracking: # 查询组件摘要状态与电子面单 getPath 轨迹的按需同步边界。
        refresh-interval: 5m # 小程序短时间重复打开订单时复用最近同步结果。
        claim-timeout: 5m # 进程中断后允许下一次请求接管同步占用。
        max-path-items: 200 # 单次最多接受 200 个规范化轨迹节点。
    shipping: # 微信小程序发货信息管理配置。
      http:
        connect-timeout: 3s
        read-timeout: 15s
        max-response-size: 1MB
      delivery: # 本地发货提交后的可靠微信投递与未知结果对账。
        delay: 15s
        batch-size: 50
        claim-timeout: 1m
        max-attempts: 8
        retry-backoff: 30s
        max-retry-backoff: 30m
        unknown-recheck-interval: 1m
        not-uploaded-confirmations: 2
      receipt-reconciliation: # 微信自动收货后，将微信状态安全同步回本地订单。
        delay: 5m # 每 5 分钟扫描一批候选订单。
        batch-size: 50 # 单轮最多向微信查询 50 笔。
        min-shipped-age: 1h # 发货满 1 小时后才进入后台对账。
        recheck-interval: 30m # 同一待收货订单最多每 30 分钟查询一次。
        claim-timeout: 5m # 进程中断后允许其他实例接管过期任务。
  pay: # 微信支付、退款和支付恢复任务配置入口。
    # 商户号、APIv3 Key、PEM 等业务凭据只从加密数据库配置读取。
    mock-enabled: false # 是否启用支付模拟实现；测试环境可在 application-test.yaml 中覆盖。
    notification: # 微信支付回调请求校验配置。
      max-timestamp-skew: 5m # 回调时间戳与服务器时间最多允许相差 5 分钟。
    initiation: # 创建微信预支付单时的并发占用配置。
      claim-timeout: 2m # 预支付创建占用超过 2 分钟后允许恢复。
    timeout-scan-enabled: true # 启用超时支付订单自动核查任务。
    timeout-scan-delay: 60s # 超时支付核查任务每 60 秒执行一次。
    timeout-scan-batch-size: 50 # 每次最多核查 50 个超时支付订单。
    timeout-scan-claim-timeout: 5m # 超时订单处理占用超过 5 分钟后允许其他任务接管。
    refund-recovery: # 微信退款异常和中断状态的自动恢复配置。
      enabled: true # 启用退款恢复任务。
      delay: 60s # 退款恢复任务每 60 秒执行一次。
      batch-size: 20 # 每次最多恢复 20 个退款记录。
      min-age: 1m # 退款进入处理中至少 1 分钟后才参与恢复。
      claim-timeout: 5m # 退款恢复占用超过 5 分钟后允许重新接管。
      base-retry-delay: 1m # 首次恢复重试的基础等待时间为 1 分钟。
      max-retry-delay: 30m # 指数退避后的最大重试等待时间为 30 分钟。
    expire-minutes: 15 # 订单提交时固化支付截止时间，后续发起支付不得延长。
  finance:
    reconciliation: # 微信支付交易账单对账；本阶段不包含资金账单或银行流水对账。
      daily-cron: "0 30 10 * * *" # 北京时间 10:30，避开微信昨日账单生成窗口。
      worker-delay: 30s
      claim-timeout: 15m
      retry-base: 5m
      retry-max: 6h
      max-attempts: 8
      lookback-days: 90
      max-source-size: 20MB
      max-rows: 50000 # 首版单商户单日上限；分块写 SQL，但整批证据发布仍在一个事务中。
      max-field-length: 4096
      export-max-days: 31
      export-max-rows: 50000
