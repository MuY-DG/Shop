spring:
  application:
    name: shop-server
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

shop:
  api:
    success-code: 200
    success-message: success
  auth:
    token-store: redis
    admin-access-ttl: 2h
    admin-refresh-ttl: 7d
    app-access-ttl: 7d
    app-refresh-ttl: 30d
