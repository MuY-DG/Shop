spring:
  datasource: # txcloud 与 shop 使用相同的服务器拓扑，只有秘密和可信代理不同。
    url: jdbc:mysql://mysql:3306/hotpot_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: shop
    password: ${SHOP_DB_PASSWORD}
  data:
    redis:
      host: redis
      password: ${SHOP_REDIS_PASSWORD}

server:
  address: 0.0.0.0 # server Profile 只用于 Compose；宿主机端口仍固定绑定 127.0.0.1。

management:
  info:
    defaults:
      enabled: false # 所有 Actuator 自动 InfoContributor 默认关闭，自定义白名单贡献者不受影响。
    build:
      enabled: false # 关闭 Actuator 默认构建详情，公网端点仅由 ShopReleaseInfoContributor 输出白名单字段。
    git:
      enabled: false # 不公开分支、提交时间等额外 Git 信息。
    env:
      enabled: false # 不通过 info.* 环境属性扩大公开信息面。

shop:
  security:
    client-ip:
      trusted-proxy-cidrs: 127.0.0.0/8,::1/128,172.23.0.1/32 # 与 Compose 固定 edge IPAM 一致，只信任精确网关。
      max-forwarded-hops: 1 # OpenResty 必须覆盖 X-Forwarded-For，服务器链路只接受一跳。

logging:
  level:
    org.muybaby.shopserver.logistics.provider.RealWechatShippingProvider: warn # 生产仅保留微信发货提供方的异常日志，隐藏高频正常查询过程。
