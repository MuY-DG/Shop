spring:
  config:
    import: file:config/runtime/local.env[.properties] # local 只读取本机的单一 runtime manifest。
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/hotpot_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${SHOP_DB_ROOT_PASSWORD} # 本地 MySQL root 密码仅从 ignored manifest 读取。
logging:
  level:
    org.muybaby.shopserver: debug # 输出项目 DEBUG 日志，可能包含调试参数，不得用于服务器。

springdoc:
  api-docs: # OpenAPI JSON 描述端点配置。
    enabled: true # 开发环境开启接口描述端点。
  swagger-ui: # Swagger UI 页面配置。
    enabled: true # 开发环境开启接口浏览页面。
