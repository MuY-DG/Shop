spring:
  config:
    import: optional:file:.env.dev.local[.properties] # dev 自动读取本机开发变量，不需要手改公共配置。
  datasource:
    url: ${SHOP_DB_URL:jdbc:mysql://127.0.0.1:3306/hotpot_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SHOP_DB_USERNAME:root}
    password: ${SHOP_DB_PASSWORD:123456}
  flyway:
    placeholders: # 覆盖 V36 使用的 Super 安全占位符。
      seed_super_status: ENABLED # 开发数据库首次迁移时启用 Super，方便本地调试。
      seed_super_password_hash: "$2y$10$VtYIL778Ftr75pHOJ3dV0efoMsPK20vZncmZ/vB6tkYj3aW9fqT.i" # 开发环境公开密码 123456 的 BCrypt 哈希，禁止用于生产。
logging:
  level:
    org.muybaby.shopserver: debug # 输出项目 DEBUG 日志，可能包含调试参数，不得用于生产。

springdoc:
  api-docs: # OpenAPI JSON 描述端点配置。
    enabled: ${SHOP_OPENAPI_ENABLED:true} # 开发环境默认开启接口描述端点。
  swagger-ui: # Swagger UI 页面配置。
    enabled: ${SHOP_OPENAPI_ENABLED:true} # 开发环境默认开启接口浏览页面。
