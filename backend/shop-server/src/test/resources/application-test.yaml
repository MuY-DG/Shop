spring:
  datasource:
    url: jdbc:h2:mem:shop_test_${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      connection-init-sql: SELECT 1
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ''
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testmigration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

shop:
  secret-encryption:
    active-key-id: test-main
    key-ring: test-main=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    rotation-enabled: false
  customer-service:
    transfer-timeout-job-enabled: false
  auth:
    token-store: memory
    admin-access-ttl: 2h
    admin-refresh-ttl: 7d
    app-access-ttl: 7d
    app-refresh-ttl: 30d
    admin-session-reconciliation:
      enabled: false
    admin-login-protection:
      enabled: false
      store: memory
  analytics:
    rate-limit:
      enabled: false
  storage:
    limits:
      image-max-size: 5MB
      image-max-width: 8192
      image-max-height: 8192
      image-max-pixels: 25000000
      video-max-size: 50MB
  wechat:
    mini-program:
      mock-enabled: true
    shipping:
      delivery:
        claim-timeout: 10m
  pay:
    mock-enabled: true
    initiation:
      claim-timeout: 2m
    timeout-scan-enabled: false
    refund-recovery:
      enabled: false
    expire-minutes: 1440
