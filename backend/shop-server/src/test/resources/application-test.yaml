spring:
  datasource:
    url: jdbc:h2:mem:shop_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

shop:
  auth:
    token-store: memory
    admin-access-ttl: 2h
    admin-refresh-ttl: 7d
    app-access-ttl: 7d
    app-refresh-ttl: 30d
  storage:
    provider: local
    public-base-url: http://localhost:8080
    local:
      root: ${java.io.tmpdir}/shop-server-test-uploads
    limits:
      image-max-size: 5MB
      private-file-max-size: 1MB
  wechat:
    mini-program:
      mock-enabled: true
    shipping:
      upload-enabled: false
  pay:
    enabled: true
    mock-enabled: true
    config-source: DB
    expire-minutes: 15
    secret-key: 0123456789abcdef0123456789abcdef
