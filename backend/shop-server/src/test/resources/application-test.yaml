spring:
  datasource:
    url: jdbc:h2:mem:shop_test_${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      connection-init-sql: SELECT 1
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testmigration
    placeholders:
      seed_super_status: ENABLED
      seed_super_password_hash: "$2y$10$VtYIL778Ftr75pHOJ3dV0efoMsPK20vZncmZ/vB6tkYj3aW9fqT.i"
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

shop:
  secret-encryption:
    write-version: 1
    legacy-key: 0123456789abcdef0123456789abcdef
    rotation-enabled: false
  customer-service:
    transfer-timeout-job-enabled: false
  auth:
    token-store: memory
    admin-access-ttl: 2h
    admin-refresh-ttl: 7d
    app-access-ttl: 7d
    app-refresh-ttl: 30d
    admin-session-reconciliation:
      enabled: false
    admin-login-protection:
      enabled: false
      store: memory
  analytics:
    rate-limit:
      enabled: false
  storage:
    limits:
      image-max-size: 5MB
      image-max-width: 8192
      image-max-height: 8192
      image-max-pixels: 25000000
      video-max-size: 50MB
      private-file-max-size: 1MB
  wechat:
    mini-program:
      mock-enabled: true
    shipping:
      upload-enabled: false
      receipt-reconciliation:
        enabled: false
  pay:
    enabled: true
    mock-enabled: true
    initiation:
      claim-timeout: 2m
    timeout-scan-enabled: false
    refund-recovery:
      enabled: false
    config-source: DB
    expire-minutes: 1440
