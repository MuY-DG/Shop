<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="200" height="200">
  <defs>
    <!-- 黑曜石底色 -->
    <radialGradient id="obsidian" cx="45%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#2c2c38"/>
      <stop offset="28%" stop-color="#1c1c28"/>
      <stop offset="58%" stop-color="#101018"/>
      <stop offset="100%" stop-color="#060609"/>
    </radialGradient>
    <!-- 黑曜石虹彩 -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a4d7b" stop-opacity="0.30"/>
      <stop offset="22%" stop-color="#1a1a24" stop-opacity="0.04"/>
      <stop offset="48%" stop-color="#2d5a4d" stop-opacity="0.22"/>
      <stop offset="74%" stop-color="#1a1a24" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#4d3d6a" stop-opacity="0.26"/>
    </linearGradient>
    <!-- 金色边框 -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D79B"/>
      <stop offset="35%" stop-color="#D4A055"/>
      <stop offset="65%" stop-color="#F4C482"/>
      <stop offset="100%" stop-color="#C8944A"/>
    </linearGradient>
    <!-- V 字母金色 -->
    <linearGradient id="vGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4B0"/>
      <stop offset="45%" stop-color="#FFC87C"/>
      <stop offset="100%" stop-color="#D4944A"/>
    </linearGradient>
    <!-- 顶部切面高光 -->
    <linearGradient id="topFacet" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 钻石裁剪路径 -->
    <clipPath id="diamondClip">
      <path d="M97.56 60.06 h285.08 a20 20 0 0 1 16.18 8.24
               l76.44 105.12 a10 10 0 0 1 -0.74 12.66
               l-227.08 246 a10 10 0 0 1 -14.7 0
               L5.66 186.1 a10 10 0 0 1 -0.74 -12.66
               l76.46 -105.12 a20 20 0 0 1 16.18 -8.24 Z"/>
    </clipPath>
  </defs>

  <!-- ===== 钻石主体：黑曜石填充 + 细金边框 ===== -->
  <path d="M97.56 60.06 h285.08 a20 20 0 0 1 16.18 8.24
           l76.44 105.12 a10 10 0 0 1 -0.74 12.66
           l-227.08 246 a10 10 0 0 1 -14.7 0
           L5.66 186.1 a10 10 0 0 1 -0.74 -12.66
           l76.46 -105.12 a20 20 0 0 1 16.18 -8.24 Z"
        fill="url(#obsidian)"
        stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>

  <!-- 虹彩光泽层 -->
  <path d="M97.56 60.06 h285.08 a20 20 0 0 1 16.18 8.24
           l76.44 105.12 a10 10 0 0 1 -0.74 12.66
           l-227.08 246 a10 10 0 0 1 -14.7 0
           L5.66 186.1 a10 10 0 0 1 -0.74 -12.66
           l76.46 -105.12 a20 20 0 0 1 16.18 -8.24 Z"
        fill="url(#sheen)"/>

  <!-- ===== 钻石切面线（裁剪在钻石内部） ===== -->
  <g clip-path="url(#diamondClip)">
    <!-- 腰线（girdle） -->
    <line x1="5" y1="186" x2="475" y2="186"
          stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.2"/>
    <!-- 冠部斜切面 -->
    <line x1="97.56" y1="60" x2="5.66" y2="186"
          stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <line x1="382.64" y1="60" x2="474.34" y2="186"
          stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <line x1="240" y1="60" x2="120" y2="186"
          stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.8"/>
    <line x1="240" y1="60" x2="360" y2="186"
          stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.8"/>
    <!-- 亭部斜切面 -->
    <line x1="5.66" y1="186" x2="240" y2="432"
          stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.8"/>
    <line x1="474.34" y1="186" x2="240" y2="432"
          stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.8"/>
    <!-- 顶部切面高光 -->
    <path d="M97.56 60 L382.64 60 L474.34 186 L5.66 186 Z"
          fill="url(#topFacet)"/>
    <!-- 镜面微光 -->
    <ellipse cx="200" cy="140" rx="55" ry="28"
             fill="#ffffff" fill-opacity="0.04"
             transform="rotate(-15 200 140)"/>
  </g>

  <!-- ===== 金色字母 V ===== -->
  <path d="M163 132 L240 358 L317 132 L283 132 L240 296 L197 132 Z"
        fill="url(#vGold)"/>
</svg>
