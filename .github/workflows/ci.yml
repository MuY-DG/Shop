name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit and H2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/shop-server/pom.xml
      - name: Verify Flyway migration sequence
        working-directory: backend/shop-server
        run: ./scripts/verify-flyway-migrations.sh
      - name: Verify backend test-layer contract
        working-directory: backend/shop-server
        run: ./scripts/verify-test-layers.sh
      - name: Run Docker-free unit and H2 tests
        working-directory: backend/shop-server
        run: ./mvnw --batch-mode --no-transfer-progress test

  backend-integration:
    name: Backend MySQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/shop-server/pom.xml
      - name: Require Docker
        run: docker info
      - name: Run tagged Testcontainers integration tests
        working-directory: backend/shop-server
        run: ./mvnw --batch-mode --no-transfer-progress -Pintegration verify
      - name: Require every integration suite and zero skipped tests
        working-directory: backend/shop-server
        run: ./scripts/assert-integration-test-results.sh target/failsafe-reports

  admin:
    name: Admin check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: admin
        run: pnpm install --frozen-lockfile
      - name: Run checks
        working-directory: admin
        run: pnpm check
      - name: Build production bundle
        working-directory: admin
        env:
          CI: "true"
        run: pnpm build
      - name: Verify generated import metadata is current
        working-directory: admin
        run: pnpm check:generated-imports

  miniprogram:
    name: Mini Program check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: miniprogram/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: miniprogram
        run: pnpm install --frozen-lockfile
      - name: Run checks
        working-directory: miniprogram
        run: pnpm check

  dependency-review:
    name: Dependency vulnerability review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Reject newly introduced high-severity vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
